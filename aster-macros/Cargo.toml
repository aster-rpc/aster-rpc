[package]
name = "aster-macros"
version = "0.3.0"
edition = "2021"
description = "Proc-macros for the Aster RPC framework (#[derive(AsterType)], #[aster::service])."
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
