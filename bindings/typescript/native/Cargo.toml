[package]
name = "aster-transport-napi"
version = "0.3.0"
edition = "2021"
rust-version.workspace = true
description = "NAPI-RS bindings for Aster transport (Iroh P2P)"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
aster_transport_core = { path = "../../../core", version = "=0.3.0" }
aster-otel = { path = "../../../aster-otel", version = "=0.3.0" }
# Plan D1: the binding wraps the `aster` crate (Node, AsterConfig, identity
# files); core stays a direct dependency for the reactor ring, call pool and
# tunnels, reached through `aster::binding_support`. Binding profile:
# default + rpc + metrics + binding-support + coordination-client (plan D7:
# the coordination client is wrapped, never ported; see aster/Cargo.toml) +
# expose (socket targets with JavaScript authorization over R6 upcalls).
aster = { path = "../../../aster", version = "=0.3.0", features = ["rpc", "metrics", "binding-support", "coordination-client", "expose"] }
napi = { version = "3", default-features = false, features = ["async", "napi9", "serde-json"] }
napi-derive = { version = "3", features = ["type-def"] }
tokio = { workspace = true }
anyhow = { workspace = true }
serde_json = "1"
toml = "0.8"
hex = "0.4"
async-trait = "0.1"

[features]
# Test-only: builds the `aster-coordination-fixture` binary (a real voter group
# for tests/typescript). The voter stays Rust-only (D7) — this feature never
# reaches the addon `napi build` produces.
coordination-fixture = ["aster/coordination-testing"]

[[bin]]
name = "aster-coordination-fixture"
path = "fixtures/coordination_fixture.rs"
required-features = ["coordination-fixture"]
test = false
bench = false

[build-dependencies]
napi-build = "2"
