[package]
name = "aster-transport-napi"
version = "0.3.0"
edition = "2021"
rust-version.workspace = true
description = "NAPI-RS bindings for Aster transport (Iroh P2P)"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
aster-transport-salvo = { path = "../../../aster-transport-salvo", version = "=0.3.0" }
aster_transport_core = { path = "../../../core", version = "=0.3.0" }
# Observability (design OBSERVABILITY_HEALTH_DESIGN §8 O7): OTLP export of the
# three signals, plus the Prometheus pull reader behind `HealthServer` and
# `prometheusText()`. Same feature set as the C ABI (`ffi/Cargo.toml`).
aster-otel = { path = "../../../aster-otel", version = "=0.3.0", features = ["otlp", "otlp-logs", "prometheus"] }
# Plan D1: the binding wraps the `aster` crate (Node, AsterConfig, identity
# files); core stays a direct dependency for the reactor ring, call pool and
# tunnels, reached through `aster::binding_support`. Binding profile:
# default + rpc + metrics + binding-support + coordination-client (plan D7:
# the coordination client is wrapped, never ported; see aster/Cargo.toml) +
# expose (socket targets with JavaScript authorization over R6 upcalls) + otel
# and health (built-in metrics / spans, the /healthz /readyz /metrics listener).
aster = { path = "../../../aster", version = "=0.3.0", features = ["rpc", "binding-support", "coordination-client", "expose", "otel", "health", "audit-outbox"] }
napi = { version = "3", default-features = false, features = ["async", "napi9", "serde-json"] }
napi-derive = { version = "3", features = ["type-def"] }
tokio = { workspace = true }
anyhow = { workspace = true }
serde_json = "1"
toml = "0.8"
hex = "0.4"
tracing = "0.1"
async-trait = "0.1"

[features]
# Test-only: exports `emitTestLogs` / `testEmitted` (a synthetic Rust log
# source for the O7 log-bridge tests) and enables shared diagnostic events used
# by bounded lease investigations. Never in a published addon:
# `bun run build:test-hooks` builds it for the test legs.
test-hooks = ["aster/reactor-test-hooks"]
# Test-only: builds the `aster-coordination-fixture` binary (a real voter group
# for tests/typescript). The voter stays Rust-only (D7) — this feature never
# reaches the addon `napi build` produces.
coordination-fixture = ["aster/coordination-testing"]

[[bin]]
name = "aster-coordination-fixture"
path = "fixtures/coordination_fixture.rs"
required-features = ["coordination-fixture"]
test = false
bench = false

[build-dependencies]
napi-build = "2"
