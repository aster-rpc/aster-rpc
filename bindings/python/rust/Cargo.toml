[package]
name    = "aster_rs"
version = "0.3.0"
edition = "2021"
rust-version.workspace = true
publish = false

[lib]
name    = "_aster"
crate-type = ["cdylib"]

[dependencies]
# The `aster` crate is the binding's backend (plan D1): Node, AsterConfig and
# its env/TOML loaders, typed ids, the secret-key file. Binding profile =
# default + rpc + metrics + binding-support (see aster/Cargo.toml).
aster = { path = "../../../aster", version = "=0.3.0", features = ["rpc", "metrics", "binding-support"] }
# Transport core, still driven directly for the reactor ring, client-call
# pool, tunnels and bare endpoints (reached from `aster` handles through
# `aster::binding_support`).
aster_transport_core = { path = "../../../core", version = "=0.3.0" }

# Python FFI
pyo3        = { workspace = true }
pyo3-async-runtimes = { workspace = true }

# Serialization (needed for contract submodule JSON dispatch)
serde_json  = "1"

# Common dependencies
tokio       = { workspace = true }
hex         = "0.4"

# Crypto primitives (exposed to Python, replacing cryptography + blake3 packages)
blake3          = "1"
ed25519-dalek   = { version = "=3.0.0-rc.0", features = ["rand_core"] }
getrandom       = "0.3"
