[package]
name    = "aster_rs"
version = "0.3.0"
edition = "2021"
rust-version.workspace = true
publish = false

[lib]
name    = "_aster"
crate-type = ["cdylib"]

[dependencies]
# The `aster` crate is the binding's backend (plan D1): Node, AsterConfig and
# its env/TOML loaders, typed ids, the secret-key file. Binding profile =
# default + rpc + binding-support + coordination-client (plan D7:
# the coordination client is wrapped, never ported; see aster/Cargo.toml)
# + expose (socket targets with a Python authorize hook by upcall, R6)
# + otel + health (observability O6: the built-in RPC metrics and spans, the
# ops listener, all over the Rust pipeline in `aster-otel`).
aster = { path = "../../../aster", version = "=0.3.0", features = ["rpc", "binding-support", "coordination-client", "expose", "otel", "health", "audit-outbox"] }
# Transport core, still driven directly for the reactor ring, client-call
# pool, tunnels and bare endpoints (reached from `aster` handles through
# `aster::binding_support`).
aster_transport_core = { path = "../../../core", version = "=0.3.0" }
# The observability pipeline (init, log bridge, instruments, spans). `otlp-logs`
# is the application-log appender (path B, design 3.4); `prometheus` is the
# pull reader `health` already requires.
aster-otel = { path = "../../../aster-otel", version = "=0.3.0", features = ["otlp-logs", "prometheus"] }

# Python FFI
pyo3        = { workspace = true }
pyo3-async-runtimes = { workspace = true }

# Serialization (needed for contract submodule JSON dispatch)
serde_json  = "1"

# Common dependencies
tokio       = { workspace = true }
anyhow      = { workspace = true }
async-trait = "0.1"
hex         = "0.4"

# Crypto primitives (exposed to Python, replacing cryptography + blake3 packages)
blake3          = "1"
ed25519-dalek   = { version = "=3.0.0-rc.0", features = ["rand_core"] }
getrandom       = "0.3"
