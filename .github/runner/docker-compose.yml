# Docker Compose for self-hosted GitHub Actions runners (ephemeral / JIT).
#
# These runners are EPHEMERAL: each container runs exactly one job from a
# just-in-time config minted off a PAT, then exits and is restarted clean.
# That is what keeps _work from ever accumulating a corrupt checkout.
#
# Usage:
#   1. Create a fine-grained PAT with repo "Administration: read & write"
#      on the runner repo (or a classic PAT with the `repo` scope).
#   2. Copy .env.example to .env and fill in GITHUB_URL + GH_PAT (chmod 600).
#   3. Build + run the service for this machine, e.g. on the x86 box:
#      docker compose -f .github/runner/docker-compose.yml up -d --build linux-x64
#
# Each service is one machine's runner. Deploy the relevant service per host.

x-common: &common
  image: aster-runner:latest
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file: .env

services:
  # ── Deploy on: Ubuntu x86 machine ─────────────────────────────────
  linux-x64:
    <<: *common
    container_name: aster-runner-linux-x64
    environment:
      RUNNER_NAME_PREFIX: aster-linux-x64
      RUNNER_LABELS: Linux,X64
    volumes:
      - cargo-linux-x64:/cache/cargo
      - sccache-linux-x64:/cache/sccache
      - uv-linux-x64:/cache/uv

  # ── Deploy on: OCI Ubuntu ARM machine ──────────────────────────────
  linux-arm64:
    <<: *common
    container_name: aster-runner-linux-arm64
    environment:
      RUNNER_NAME_PREFIX: aster-linux-arm64
      RUNNER_LABELS: Linux,ARM64
    volumes:
      - cargo-linux-arm64:/cache/cargo
      - sccache-linux-arm64:/cache/sccache
      - uv-linux-arm64:/cache/uv

volumes:
  cargo-linux-x64:
  sccache-linux-x64:
  uv-linux-x64:
  cargo-linux-arm64:
  sccache-linux-arm64:
  uv-linux-arm64:
