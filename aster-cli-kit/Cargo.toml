[package]
name = "aster-cli-kit"
version = "0.3.0"
edition = "2024"
rust-version.workspace = true
description = "Shared conventions for the Aster CLI and the command families it hosts: errors, exit codes, output, prompts, MCP tools."
license = "MIT OR Apache-2.0"
repository = "https://forge.emrul.dev/Aster/aster-rpc-internal"
publish = false

# Dependency policy: docs/_internal/working_ideas/aster-cli-rust.md. Default
# features are off wherever they pull in more than this crate uses; every
# crate here except clap and anstyle is already in the Aster facade's tree.
[dependencies]
anyhow = { workspace = true }
aster-config = { path = "../aster-config" }
anstyle = "1"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true }
unicode-width = "0.2"
