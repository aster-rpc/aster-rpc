name: Linux and Windows CI and artifacts

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "core/**"
      - "aster/**"
      - "ffi/**"
      - "bindings/python/**"
      - "cli/**"
      - "tests/python/**"
      - "tests/chaos/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "VERSION"
      - "scripts/build.sh"
      - "scripts/release.sh"
      - "scripts/release/**"
      - ".forgejo/**"
      - ".github/runner/Dockerfile"
  pull_request:
    paths:
      - "core/**"
      - "aster/**"
      - "ffi/**"
      - "bindings/python/**"
      - "cli/**"
      - "tests/python/**"
      - "tests/chaos/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "VERSION"
      - "scripts/build.sh"
      - "scripts/release.sh"
      - "scripts/release/**"
      - ".forgejo/**"
      - ".github/runner/Dockerfile"
  workflow_dispatch:

concurrency:
  group: forgejo-aster-build-${{ forgejo.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep downloads and Cargo's cross-run usage database together. The runner
  # mounts this path but leaves workspace target/ directories disposable.
  CARGO_HOME: /cache/cargo
  CARGO_INCREMENTAL: "0"
  CARGO_CACHE_AUTO_CLEAN_FREQUENCY: "1 day"
  SCCACHE_DIR: /cache/sccache
  SCCACHE_CACHE_SIZE: "10G"
  RUSTC_WRAPPER: sccache
  UV_CACHE_DIR: /cache/uv

jobs:
  # Linux compilation and tests stay on the container-isolated Forge host.
  lint:
    runs-on: aster-forge-linux-x64
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve Aster build version
        run: |
          version="$(scripts/release/version.sh)"
          scripts/release/prepare-python-build.sh "$version"
          echo "ASTER_BUILD_VERSION=$version" >> "$GITHUB_ENV"
      - name: Checkout pinned Salvo fork
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          repository: Aster/salvo
          ref: 0e8477c10760b7f66fa5667e2755c938d07393c0
          path: _deps/salvo
          token: ${{ secrets.ASTER_REPO_TOKEN }}
          persist-credentials: false
      - name: Link sibling path dependency
        run: ln -s "$GITHUB_WORKSPACE/_deps/salvo" "$GITHUB_WORKSPACE/../salvo"
      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          python3 --version
          uv --version
          node --version
      - name: aster-cli compatibility
        run: python3 scripts/check-cli-compat.py
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --locked --workspace --all-targets --exclude aster-transport-napi -- -D warnings
      - name: Compiler-cache statistics
        if: always()
        continue-on-error: true
        run: sccache --show-stats

  test:
    needs: lint
    runs-on: aster-forge-linux-x64
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve Aster build version
        run: |
          version="$(scripts/release/version.sh)"
          scripts/release/prepare-python-build.sh "$version"
          echo "ASTER_BUILD_VERSION=$version" >> "$GITHUB_ENV"
      - name: Checkout pinned Salvo fork
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          repository: Aster/salvo
          ref: 0e8477c10760b7f66fa5667e2755c938d07393c0
          path: _deps/salvo
          token: ${{ secrets.ASTER_REPO_TOKEN }}
          persist-credentials: false
      - name: Link sibling path dependency
        run: ln -s "$GITHUB_WORKSPACE/_deps/salvo" "$GITHUB_WORKSPACE/../salvo"
      - name: Rust core and FFI tests
        run: |
          cargo test --locked -p aster_transport_core
          cargo test --locked -p aster_transport_ffi
      - name: Python framework tests
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python \
            pytest pytest-asyncio pytest-timeout maturin \
            "pyfory==0.16.0" "zstandard>=0.25.0"
          .venv/bin/maturin develop --release --locked \
            -m bindings/python/rust/Cargo.toml
          uv pip install --python .venv/bin/python -e cli/
          .venv/bin/pytest tests/python/ tests/chaos/ \
            -v --timeout=30 -m "not network and not iroh_primitives"
      - name: Compiler-cache statistics
        if: always()
        continue-on-error: true
        run: sccache --show-stats

  build-linux-wheel:
    needs: test
    runs-on: aster-forge-linux-x64
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve Aster build version
        run: |
          version="$(scripts/release/version.sh)"
          scripts/release/prepare-python-build.sh "$version"
          echo "ASTER_BUILD_VERSION=$version" >> "$GITHUB_ENV"
      - name: Checkout pinned Salvo fork
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          repository: Aster/salvo
          ref: 0e8477c10760b7f66fa5667e2755c938d07393c0
          path: _deps/salvo
          token: ${{ secrets.ASTER_REPO_TOKEN }}
          persist-credentials: false
      - name: Link sibling path dependency
        run: ln -s "$GITHUB_WORKSPACE/_deps/salvo" "$GITHUB_WORKSPACE/../salvo"
      - name: Build Linux wheel and source distribution
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python maturin
          .venv/bin/maturin build --release --locked \
            --out dist -m bindings/python/rust/Cargo.toml
          .venv/bin/maturin sdist \
            --out dist -m bindings/python/rust/Cargo.toml
      - name: Store workflow artifact on Forgejo
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: aster-python-linux-${{ forgejo.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ forgejo.event_name == 'pull_request' && 7 || 30 }}
      - name: Publish dev artifacts to Forgejo packages
        if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main'
        env:
          ASTER_PACKAGE_TOKEN: ${{ secrets.ASTER_PACKAGE_TOKEN }}
        run: |
          package_version="dev-${FORGEJO_RUN_NUMBER}"
          for artifact in dist/*; do
            artifact_name=$(basename "$artifact")
            curl --fail-with-body --silent --show-error \
              --user "agents:${ASTER_PACKAGE_TOKEN}" \
              --upload-file "$artifact" \
              "${FORGEJO_SERVER_URL}/api/packages/Aster/generic/aster-python/${package_version}/${artifact_name}"
          done
      - name: Compiler-cache statistics
        if: always()
        continue-on-error: true
        run: sccache --show-stats

  # Build the Windows wheel on the Forge host with cargo-xwin. The resulting
  # abi3 wheel is import-tested by the existing native Windows GitHub matrix;
  # macOS remains unchanged.
  build-windows-wheel:
    needs: test
    runs-on: aster-forge-cross-x64
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve Aster build version
        run: |
          version="$(scripts/release/version.sh)"
          scripts/release/prepare-python-build.sh "$version"
          echo "ASTER_BUILD_VERSION=$version" >> "$GITHUB_ENV"
      - name: Checkout pinned Salvo fork
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          repository: Aster/salvo
          ref: 0e8477c10760b7f66fa5667e2755c938d07393c0
          path: _deps/salvo
          token: ${{ secrets.ASTER_REPO_TOKEN }}
          persist-credentials: false
      - name: Build Windows wheel with cargo-xwin
        run: |
          ln -s "$GITHUB_WORKSPACE/_deps/salvo" "$GITHUB_WORKSPACE/../salvo"
          uv venv .venv
          uv pip install --python .venv/bin/python maturin
          .venv/bin/maturin build --release --locked \
            --target x86_64-pc-windows-msvc \
            --out dist -m bindings/python/rust/Cargo.toml
      - name: Store workflow artifact on Forgejo
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: aster-python-windows-x64-${{ forgejo.run_number }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: ${{ forgejo.event_name == 'pull_request' && 7 || 30 }}
      - name: Publish dev artifact to Forgejo packages
        if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main'
        env:
          ASTER_PACKAGE_TOKEN: ${{ secrets.ASTER_PACKAGE_TOKEN }}
        run: |
          package_version="dev-${FORGEJO_RUN_NUMBER}"
          for artifact in dist/*.whl; do
            artifact_name=$(basename "$artifact")
            curl --fail-with-body --silent --show-error \
              --user "agents:${ASTER_PACKAGE_TOKEN}" \
              --upload-file "$artifact" \
              "${FORGEJO_SERVER_URL}/api/packages/Aster/generic/aster-python/${package_version}/${artifact_name}"
          done
      - name: Compiler-cache statistics
        if: always()
        continue-on-error: true
        run: sccache --show-stats

  # Native Apple Silicon wheels run on the dedicated repository-scoped Mac
  # runner. Never execute pull-request code on this non-isolated host.
  build-macos-wheel:
    if: forgejo.event_name != 'pull_request'
    needs: test
    runs-on: aster-forge-macos-arm64
    env:
      CARGO_HOME: /Users/emrul/dev/aster/local_mac_forgejo_runner/cache/cargo
      SCCACHE_DIR: /Users/emrul/dev/aster/local_mac_forgejo_runner/cache/sccache
      UV_CACHE_DIR: /Users/emrul/dev/aster/local_mac_forgejo_runner/cache/uv
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve Aster build version
        run: |
          version="$(scripts/release/version.sh)"
          scripts/release/prepare-python-build.sh "$version"
          echo "ASTER_BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/aster-target" >> "$GITHUB_ENV"
      - name: Checkout pinned Salvo fork
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          repository: Aster/salvo
          ref: 0e8477c10760b7f66fa5667e2755c938d07393c0
          path: _deps/salvo
          token: ${{ secrets.ASTER_REPO_TOKEN }}
          persist-credentials: false
      - name: Link sibling path dependency
        run: |
          salvo_link="$GITHUB_WORKSPACE/../salvo"
          if [[ -e "$salvo_link" && ! -L "$salvo_link" ]]; then
            echo "error: refusing to replace non-symlink $salvo_link" >&2
            exit 1
          fi
          ln -sfn "$GITHUB_WORKSPACE/_deps/salvo" "$salvo_link"
      - name: Build and import-test macOS arm64 wheel
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python maturin
          .venv/bin/maturin build --release --locked \
            --out dist -m bindings/python/rust/Cargo.toml
          uv venv .wheel-test
          uv pip install --python .wheel-test/bin/python dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.wheel-test/bin/python" -c \
            'import aster, os; assert aster.VERSION == os.environ["ASTER_BUILD_VERSION"]; print(aster.VERSION)'
      - name: Store workflow artifact on Forgejo
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: aster-python-macos-arm64-${{ forgejo.run_number }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30
      - name: Publish dev artifact to Forgejo packages
        if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main'
        env:
          ASTER_PACKAGE_TOKEN: ${{ secrets.ASTER_PACKAGE_TOKEN }}
        run: |
          package_version="dev-${FORGEJO_RUN_NUMBER}"
          for artifact in dist/*.whl; do
            artifact_name=$(basename "$artifact")
            curl --fail-with-body --silent --show-error \
              --user "agents:${ASTER_PACKAGE_TOKEN}" \
              --upload-file "$artifact" \
              "${FORGEJO_SERVER_URL}/api/packages/Aster/generic/aster-python/${package_version}/${artifact_name}"
          done
      - name: Compiler-cache statistics
        if: always()
        continue-on-error: true
        run: sccache --show-stats
      - name: Remove disposable Mac build state
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/.venv" "$GITHUB_WORKSPACE/.wheel-test" \
            "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE/_deps" \
            "$RUNNER_TEMP/aster-target"
          if [[ -L "$GITHUB_WORKSPACE/../salvo" ]]; then
            rm "$GITHUB_WORKSPACE/../salvo"
          fi
          uv cache prune --ci || true

  release:
    if: forgejo.event_name == 'push' && startsWith(forgejo.ref, 'refs/tags/v')
    needs: [build-linux-wheel, build-windows-wheel, build-macos-wheel]
    runs-on: aster-forge-linux-x64
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve Aster build version
        run: |
          version="$(scripts/release/version.sh)"
          echo "ASTER_BUILD_VERSION=$version" >> "$GITHUB_ENV"
      - name: Download Linux release artifacts
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: aster-python-linux-${{ forgejo.run_number }}
          path: dist
      - name: Download Windows release artifacts
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: aster-python-windows-x64-${{ forgejo.run_number }}
          path: dist
      - name: Download macOS release artifacts
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: aster-python-macos-arm64-${{ forgejo.run_number }}
          path: dist
      - name: Publish permanent Forgejo release
        env:
          ASTER_RELEASE_TOKEN: ${{ secrets.ASTER_RELEASE_TOKEN }}
        run: scripts/release/publish-forgejo.sh dist
