# Aster iroh-stack fork manifest
# =============================================================================
# CANONICAL COPY: aster-rpc/iroh : docs/aster-fork-manifest.toml
# A synced copy lives at aster-rpc-internal/iroh-fork-manifest.toml.
#
# Purpose: record source provenance for maintainers and for the Cargo-registry
# publisher. Consumers should install a versioned Aster SDK release; they must
# not copy this file's patch blocks once the public registry is bootstrapped.
# A `rev` is authoritative and its tag is a human label on the same commit.
# Pin == tag == validated code. The 1.3.0 wave re-ports the noq stack
# (read_into, poll_driver, plus poll_driver GSO/stream-accept fixes, and the
# 1.3.1 read_to_end end-of-stream fix for upstream #794) onto
# noq-v1.3.0 and the iroh stack (poll_driver re-export, recv-error log
# throttle, noq fork patch) onto iroh v1.3.0. Upstream iroh 1.0.3 lowered the
# recv-error log to debug! without throttling; the throttle is still carried.
# iroh 1.3.1 adds the stand-in fix for upstream n0-computer/iroh#4600 (a new
# connection pinned to another connection's dead selected path).
# noq 1.3.2 adds the stand-in fix for upstream n0-computer/noq#437 (a stateless
# reset on any path closes the connection) and iroh 1.3.2 derives the stateless
# reset key from the secret key, so a restarted endpoint resets the stale
# connections of its previous process. iroh-util 0.6.3 and iroh-blobs 0.103.9
# retire a pooled blob connection whose provider stopped acknowledging (a restart
# on a new port) and retry on a fresh one, instead of waiting out QUIC's idle
# timeout. iroh-blobs 0.103.10 attributes each downloader attempt's payload and
# compressed bytes to its provider, live while the attempt runs.
#
# Regenerate every upgrade cycle. See docs/iroh-patches.md for the patch ledger
# and the full upgrade procedure.
# =============================================================================

schema = 1
wave = "iroh-1.3.0"
released = "2026-10-03"

[distribution]
cargo_registry = "sparse+https://forge.emrul.dev/api/packages/Aster/cargo/"
format = "source-crates"
consumer_contract = "Aster version plus Cargo.lock; never copy fork pins"

# -----------------------------------------------------------------------------
# Forks (pin these by rev in [patch.crates-io])
# -----------------------------------------------------------------------------

[forks.noq]
repo = "https://forge.emrul.dev/Aster/noq.git"
upstream_base = "noq-v1.3.0"
tag = "aster-noq-v1.3.2"
commit = "e75f3a5550feae0f40df0ffde8bf438f213a5156"
branch = "upgrade/noq-v1.3.0"
crates = ["noq", "noq-udp", "noq-proto"]
registry_crates = ["noq", "noq-udp", "noq-proto"]
crate_version = "1.3.2"
registry_bridge_crates = ["irpc", "netwatch", "portmapper"]

[forks.iroh]
repo = "https://forge.emrul.dev/Aster/iroh.git"
upstream_base = "v1.3.0"
tag = "aster-iroh-v1.3.2"
commit = "a4a9a76b01bcfbad573dfc3186b014efa1c2532d"
branch = "upgrade/iroh-v1.3.0"
crates = ["iroh", "iroh-base", "iroh-relay"]
registry_crates = ["iroh", "iroh-base", "iroh-dns", "iroh-relay"]
crate_version = "1.3.2"
registry_bridge_crates = ["iroh-mdns-address-lookup", "iroh-tickets"]

[forks.iroh-blobs]
repo = "https://forge.emrul.dev/Aster/iroh-blobs.git"
upstream_base = "v0.103.0"
tag = "aster-iroh-blobs-v0.103.10"
commit = "bcd00bb2a888f3d6990ac32d9fab1d8e2d9d73f4"
branch = "upgrade/iroh-blobs-v0.103"
crates = ["iroh-blobs"]
registry_crates = ["iroh-blobs"]
crate_version = "0.103.10"

[forks.iroh-docs]
repo = "https://forge.emrul.dev/Aster/iroh-docs.git"
upstream_base = "v0.101.0"
tag = "aster-iroh-docs-v0.101.5-p1"
commit = "ad88873ed57b1e7550ef8e091d0d7f0a947e3678"
branch = "upgrade/iroh-docs-v0.101"
crates = ["iroh-docs"]
registry_crates = ["iroh-docs"]
crate_version = "0.101.5"

[forks.iroh-util]
# Promoted from a bridge for the connection-pool deadlock fix. Lived on
# github.com/aster-rpc until the forge org repo existed; it now does, and this
# is that flip.
#
# Moved because it was the last fork not on the forge, and the only one whose
# fetch could be refused by someone else. GitHub rate limits anonymous git per
# source address, and when the Forge host crossed that limit the release
# stopped here -- reporting "could not read Username for 'https://github.com'",
# which reads like a private repository rather than a throttled public one.
# Every other fork was already on forge.emrul.dev and unaffected.
#
# The mirror is the same history, not a copy of it: same commit ids, same tags,
# and `publish-native-stack.py` checks out `commit` below and fails unless
# `git rev-parse HEAD` matches. A mirror serving different content cannot
# satisfy that, so provenance rests on the hash rather than on the hostname.
# github.com/aster-rpc/iroh-util remains as the upstream-facing copy.
# 0.6.2 packages upstream's cpfix rewrite (n0-computer/iroh-util PR #5,
# aef1db3) plus the portal-sync witness tests; it supersedes the published but
# never-consumed 0.6.1 independent patch (tag preserved). 0.6.3 adds
# ConnectionPool::retire (Aster's own), which iroh-blobs 0.103.9 uses to drop a
# pooled connection to a provider that restarted on a new address.
repo = "https://forge.emrul.dev/Aster/iroh-util.git"
upstream_base = "cpfix @ aef1db3 (upstream PR #5, over iroh-util-v0.6.0)"
tag = "aster-iroh-util-v0.6.3"
commit = "6c42d23881459fdd07feb31287616c87c4676833"
branch = "upgrade/iroh-util-v0.6"
crates = ["iroh-util"]
registry_crates = ["iroh-util"]
crate_version = "0.6.3"

[forks.iroh-gossip]
repo = "https://forge.emrul.dev/Aster/iroh-gossip.git"
upstream_base = "v0.101.0"
tag = "aster-iroh-gossip-v0.101.1"
commit = "aed725d1a6fef4e60dbe952b524c5478ec125186"
branch = "upgrade/iroh-gossip-v0.101"
crates = ["iroh-gossip"]
registry_crates = ["iroh-gossip"]
crate_version = "0.101.1"


[forks.salvo]
repo = "https://forge.emrul.dev/Aster/salvo.git"
upstream_base = "v1.0.0"
tag = "v1.0.0-aster.5"  # published source tag (also aster-salvo-2026-10-11)
commit = "35aa745dfca50c2e5a640c0d0c93153b033fa931"
branch = "main"
status = "source_published_registry_pending"  # source/tags public; 1.0.4 registry wave awaits verification release
crates = ["salvo", "salvo_core", "salvo_macros", "salvo-http3", "h3", "h3-quinn", "h3-datagram"]
registry_crates = [
  "h3", "h3-datagram", "h3-quinn", "salvo", "salvo-acme", "salvo-cache",
  "salvo-compression", "salvo-cors", "salvo-craft", "salvo-craft-macros",
  "salvo-csrf", "salvo-flash", "salvo-http3", "salvo-jwt-auth", "salvo-oapi",
  "salvo-oapi-macros", "salvo-otel", "salvo-proxy", "salvo-rate-limiter",
  "salvo-serde-util", "salvo-serve-static", "salvo-session", "salvo-tus",
  "salvo_core", "salvo_extra", "salvo_macros",
]
crate_version = "1.0.4"

# Fory is part of Aster's supported native surface, but this release carries
# the unmodified crates.io packages. Do not mirror third-party source merely to
# make every package come from one registry; add a fork entry only if Aster
# actually carries a Fory patch.
[upstream.fory]
registry = "crates-io"
crates = ["fory-core", "fory-derive"]
version = "1.7.6"

# Unmodified crates.io source republished with dependency metadata pointing at
# the Aster registry. The commits identify the code provenance; publication
# verifies the crates.io archive checksum and permits only Cargo.toml metadata
# rewrites. These packages prevent an alternate-registry fork from pulling a
# second, upstream copy of the same protocol family through a crates.io edge.
[bridges.irpc]
repo = "https://github.com/n0-computer/irpc"
commit = "0ed2b235d5c797b54d8263ecb3b0247272d055f9"
version = "0.17.0"
rewrites = ["noq"]

[bridges.netwatch]
repo = "https://github.com/n0-computer/net-tools"
commit = "0030e57fc70981895bb86212ff0f059cc41c8a4e"
version = "0.19.3"
rewrites = ["noq-udp"]

[bridges.portmapper]
repo = "https://github.com/n0-computer/net-tools"
commit = "0030e57fc70981895bb86212ff0f059cc41c8a4e"
version = "0.19.3"
rewrites = ["netwatch"]

[bridges.iroh-mdns-address-lookup]
repo = "https://github.com/n0-computer/iroh-address-lookups"
commit = "87fdd7ea1a902845695f8f685c1905f096b3d02d"
version = "0.4.0"
rewrites = ["iroh", "iroh-base"]

[bridges.iroh-tickets]
repo = "https://github.com/n0-computer/iroh-tickets"
commit = "4899684e1209dea29ed28aa2314450927557b037"
version = "1.0.0"
rewrites = ["iroh-base"]

# -----------------------------------------------------------------------------
# Transitive crates.io constraints forced by upstream's dependency updates (1.0, 1.3.0).
# These are NOT forks. They are recorded for repository bootstrap and publisher
# validation; ordinary SDK consumers receive them through released metadata and
# must not copy them into their own Cargo.toml.
# -----------------------------------------------------------------------------

[transitive]
iroh-tickets = "=1.0.0"
iroh-mdns-address-lookup = "0.4"     # 0.4.0 tracks iroh ^1.0.0 (0.3 pinned rc.1)
ed25519-dalek = "3.0.0"              # iroh 1.3.0 requires >=3.0.0-rc.0,<4.0.0; lock resolves 3.0.0
netwatch = "0.19.3"                  # iroh 1.3.0 (net-tools 0030e57fc70981895bb86212ff0f059cc41c8a4e)
portmapper = "0.19.3"                # iroh 1.3.0 (net-tools 0030e57fc70981895bb86212ff0f059cc41c8a4e)

# -----------------------------------------------------------------------------
# Bootstrap-only Cargo snippets. These exist for source-tree development and
# disaster recovery; they are not the normal consumer installation contract.
# -----------------------------------------------------------------------------

[snippets]

# Workspace version specs ([workspace.dependencies]):
version_specs = """
salvo       = "=1.0.4"
iroh        = "=1.3.2"
iroh-blobs  = "0.103.10"
iroh-docs   = "0.101.5"
iroh-gossip = "0.101.1"
iroh-tickets = "=1.0.0"
iroh-mdns-address-lookup = "0.4"
"""

