# Aster iroh-stack fork manifest
# =============================================================================
# CANONICAL COPY: aster-rpc/iroh : docs/aster-fork-manifest.toml
# A synced copy lives at aster-rpc-internal/iroh-fork-manifest.toml.
#
# Purpose: tell consumers exactly what to pin for the current release wave.
# Consumers pin by git `rev` (authoritative); the `tag` is a human label on the
# same commit. Pin == tag == validated code. The 1.0.1 wave absorbs upstream's
# Windows UDP ICMP-reset fix (n0-computer/noq#707), replacing the Aster -p1
# hand-rolled SIO_UDP_CONNRESET patch; the iroh recv-error log throttle is
# still carried as an Aster patch.
#
# Regenerate every upgrade cycle. See docs/iroh-patches.md for the patch ledger
# and the full upgrade procedure.
# =============================================================================

schema = 1
wave = "iroh-1.0.1"
released = "2026-07-02"

# -----------------------------------------------------------------------------
# Forks (pin these by rev in [patch.crates-io])
# -----------------------------------------------------------------------------

[forks.noq]
repo = "https://github.com/aster-rpc/noq"
upstream_base = "noq-v1.0.1"
tag = "aster-noq-v1.0.1"
commit = "c84091f4c1d62f3c9025e40014fc2db59f239ffc"
branch = "upgrade/noq-v1.0.1"
crates = ["noq", "noq-udp", "noq-proto"]
crate_version = "1.0.1"

[forks.iroh]
repo = "https://github.com/aster-rpc/iroh"
upstream_base = "v1.0.1"
tag = "aster-iroh-v1.0.1"
commit = "5228d64d91b10ef5f5bc9fcf8855b7774102cfc9"
branch = "upgrade/iroh-v1.0.1"
crates = ["iroh", "iroh-base", "iroh-relay"]
crate_version = "1.0.1"

[forks.iroh-blobs]
repo = "https://github.com/aster-rpc/iroh-blobs"
upstream_base = "v0.103.0"
tag = "aster-iroh-blobs-v0.103.0"
commit = "60d098c99d6a759b5b1bf0df635b149b50c74775"
branch = "upgrade/iroh-blobs-v0.103"
crates = ["iroh-blobs"]
crate_version = "0.103.0"

[forks.iroh-docs]
repo = "https://github.com/aster-rpc/iroh-docs"
upstream_base = "v0.101.0"
tag = "aster-iroh-docs-v0.101.0"
commit = "2f3f3df834dfe6ce83f052c9c94ef80db2f5627c"
branch = "upgrade/iroh-docs-v0.101"
crates = ["iroh-docs"]
crate_version = "0.101.0"

[forks.iroh-gossip]
repo = "https://github.com/aster-rpc/iroh-gossip"
upstream_base = "v0.101.0"
tag = "aster-iroh-gossip-v0.101.0"
commit = "76492e4cf8a745cae27ea57fb8a30d42ab675498"
branch = "upgrade/iroh-gossip-v0.101"
crates = ["iroh-gossip"]
crate_version = "0.101.0"


[forks.salvo]
repo = "https://github.com/aster-rpc/salvo"
upstream_base = "upstream/main through #1621 (2026-06-27 merge)"
tag = "aster-salvo-2026-07-05"
commit = "0e8477c10760b7f66fa5667e2755c938d07393c0"
branch = "main"
crates = ["salvo", "salvo_core", "salvo_macros", "salvo-http3", "h3", "h3-quinn"]
crate_version = "0.93.0"

# -----------------------------------------------------------------------------
# Transitive crates.io pins forced by upstream's 1.0 dependency update.
# These are NOT forks — pin them in your own Cargo.toml at these versions to
# avoid resolver conflicts against the forked iroh 1.0.0.
# -----------------------------------------------------------------------------

[transitive]
iroh-tickets = "=1.0.0"
iroh-mdns-address-lookup = "0.4"     # 0.4.0 tracks iroh ^1.0.0 (0.3 pinned rc.1)
ed25519-dalek = "=3.0.0-rc.0"        # iroh #4324 bumped from =3.0.0-pre.7

# -----------------------------------------------------------------------------
# Paste-ready Cargo snippets (authoritative pins for this wave).
# -----------------------------------------------------------------------------

[snippets]

# Workspace version specs ([workspace.dependencies]):
version_specs = """
iroh        = "=1.0.1"
iroh-blobs  = "0.103.0"
iroh-docs   = "0.101.0"
iroh-gossip = "0.101.0"
iroh-tickets = "=1.0.0"
iroh-mdns-address-lookup = "0.4"
"""

# Pin block ([patch.crates-io]):
patch_crates_io = """
[patch.crates-io]
iroh        = { git = "https://github.com/aster-rpc/iroh",        rev = "5228d64d91b10ef5f5bc9fcf8855b7774102cfc9" }
