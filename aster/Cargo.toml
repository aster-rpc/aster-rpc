[package]
name = "aster"
version = "0.3.0"
edition = "2021"
rust-version.workspace = true
description = "Native Rust API for Aster — peer-to-peer transport (blobs, docs, gossip) over iroh."
license = "MIT OR Apache-2.0"
repository = "https://forge.emrul.dev/Aster/aster-rpc-internal"
publish = ["aster"]

[features]
enrollment = ["delegation", "aster_transport_core/enrollment"]
delegation = ["aster_transport_core/delegation"]
default = ["blobs", "docs", "gossip"]
blobs = ["dep:iroh-blobs"]
docs = ["blobs"]
gossip = ["dep:iroh-gossip"]
# Rust-native RPC (envelope + payload codec, dispatch, client stub). Off by
# default so Step-1 consumers don't compile Fory. See docs/_internal/aster-rust.md.
rpc = [
    "dep:fory-core",
    "dep:fory-derive",
    "dep:async-trait",
    "dep:aster-macros",
    "dep:serde",
]
# Coordination (§15 Slice 0). Two features, deliberately:
#
#   coordination-client  the wire contract and client stub only. Enabling it
#                        adds neither openraft nor a direct redb dependency.
#                        The base Iroh stack already carries transitive redb
#                        versions through iroh-blobs and iroh-docs.
#   coordination         the voter: adds the replicated state machine and its
#                        storage.
#
# Neither is in `default`, so voter-only dependencies are not enabled there.
# Verify the direct edges with `cargo tree -p aster --no-default-features
# --depth 1` and the full feature graph with `-e features`.
coordination-client = ["rpc", "dep:blake3", "dep:windows-sys", "dep:ed25519-dalek"]
coordination = [
    "coordination-client",
    "dep:openraft",
    "dep:redb",
    "dep:libc",
]
# The Slice 3 internal test harness (contract matrix §S3-E, §S3-F). Adds no
# dependency: it exposes one already-existing production path -- proposing a
# command through `Raft::client_write` -- so that gate tests can seed accepted
# intents and generate committed traffic without a partial Store RPC, which
# §6.2 forbids before Slice 4.
#
# It is deliberately *not* implied by `coordination`, and no shipping profile
# turns it on. `scripts/check-coordination-deps.sh` asserts the default and
# `coordination` graphs do not enable it.
coordination-testing = ["coordination"]
audit-outbox = ["dep:redb", "dep:libc", "dep:windows-sys", "dep:serde", "dep:sha2", "dep:url", "dep:reqwest", "dep:crossbeam-channel", "dep:rustls", "dep:rustls-platform-verifier", "dep:httpdate"]
discovery = []
hooks = []
# `aster::ops`: the /healthz, /readyz, /metrics HTTP listener (the Rust home
# of the Python/TS `HealthServer`), started by `AsterServer` from the
# `[health]` config. Implies `otel` (design §6, Q15): `/metrics` is the OTel
# Prometheus pull reader (`aster-otel/prometheus`), and a listener joins or
# starts the pipeline. hyper / hyper-util / http-body-util are already in the
# graph through iroh's HTTP client; this only enables hyper's `server` half.
health = [
    "otel",
    "aster-otel/prometheus",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
]
# OpenTelemetry (design docs/_internal/bindings/OBSERVABILITY_HEALTH_DESIGN.md
# §4.1, §5, phase O2): the built-in RPC instruments, the `rpc` server and
# client spans exported to OTel, and W3C trace context / baggage on the wire.
# Everything goes through the OTel *API* that `aster-otel` re-exports; the SDK
# and exporters stay in `aster-otel` (D1), and with no pipeline initialised
# every record is a no-op. `scripts/check-otel-deps.sh` keeps the SDK out of
# the graphs that do not enable this.
otel = ["rpc", "dep:aster-otel", "dep:arc-swap"]
# Language-binding support (PyO3, NAPI, C ABI). Adds no new crate (async-trait
# is already in the graph through the transport core; the upcall adapters
# implement its traits). It exposes
# `#[doc(hidden)]` accessors from the facade types to the transport-core
# handles a binding still drives directly (dispatch ring, client-call pool,
# tunnels, raw hook receiver) -- `aster::binding_support`. Not a stable API;
# no Rust application should enable it.
#
# Binding profile -- what a binding crate enables on `aster`:
#
#   default (blobs, docs, gossip) + rpc + metrics + binding-support
#
# and, only once the binding surfaces them, `coordination-client` (wrap the
# coordination client, never port it), `expose` (HTTP-over-Aster) and `health`
# (serve /healthz, /readyz, /metrics from Rust).
# `coordination`, `coordination-testing` and `expose-edge` are Rust-only (D7)
# and never belong in a binding.
binding-support = ["dep:async-trait"]
# Test-only scheduling gates and bounded coordination timing; never shipping.
reactor-test-hooks = ["aster_transport_core/test-hooks"]
# Expose local HTTP services over Aster (the `aster-expose` L7 relay). Off by
# default so non-expose consumers don't pull in http/tower. See
# docs/aster-expose-getstarted.md.
expose = [
    "dep:aster-expose",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:bytes",
    "dep:tower",
]
# Adds the public reverse-proxy edge (Salvo + TLS/ACME). Pulls in the Salvo
# fork; only needed to run a public HTTPS listener, not to expose a service.
expose-edge = ["expose", "aster-expose/edge"]

[dependencies]
aster_transport_core = { path = "../core", version = "=0.3.0", registry = "aster" }
# L7 HTTP-over-Aster relay. Gated by the `expose` feature. The `expose-edge`
# feature turns on its Salvo-backed public edge.
aster-expose = { path = "../aster-expose", version = "=0.3.0", registry = "aster", optional = true }
# Re-exported by the `expose` module so consumers build `http::Request`s without
# adding the dep themselves. Gated by the `expose` feature.
http = { version = "1", optional = true }
# The streaming-relay body trait bound (`relay_request_streaming`). Gated by the
# `expose` feature; matches the version `aster-expose` uses.
http-body = { version = "1", optional = true }
# The foreign (upcall) HTTP handler's bodies and its `tower::Service` impl
# (`binding_support::upcall::expose`). Same versions `aster-expose` resolves,
# so nothing new enters the graph. Gated by the `expose` feature.
bytes = { workspace = true, optional = true }
tower = { version = "0.5", optional = true }
# The `health` feature's HTTP/1.1 listener. Same versions iroh's HTTP client
# already resolves; only hyper's `server` feature is new code.
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
# The `otel` feature: the observability pipeline (and, re-exported from it, the
# exactly pinned `opentelemetry` API), plus `arc-swap` for the instruments
# cached per provider generation (design §4.1a). arc-swap is already in the
# graph through iroh; pinned to the version the lock resolves.
aster-otel = { path = "../aster-otel", version = "=0.3.0", registry = "aster", optional = true }
arc-swap = { version = "=1.9.1", optional = true }
# RPC codec (Apache Fory Rust crate). Gated by the `rpc` feature. Pinned to the
# same version as core's Fory dependency. The `#[derive(ForyStruct)]` macro
# emits `::fory_core::` paths, so both crates are direct deps.
fory-core = { version = "=1.7.6", optional = true }
fory-derive = { version = "=1.7.6", optional = true }
# Ergonomic async trait for the RPC service dispatcher (the `#[aster::service]`
# macro will generate impls of it). Gated by the `rpc` feature.
async-trait = { version = "0.1", optional = true }
# `rpc::dynamic`: a binding registers a `DynamicService` as JSON (C ABI) or
# builds one in Rust; the serde form is the registration schema.
serde = { version = "1", features = ["derive"], optional = true }
# Proc-macros: #[derive(AsterType)] (and later #[aster::service]). Gated by `rpc`.
aster-macros = { path = "../aster-macros", version = "=0.3.0", registry = "aster", optional = true }
# Canonical action hashing (§5.2.1): BLAKE3 over the domain-separated encoded
# `ActionV1`. Gated by `coordination-client` because the client computes the
# same hash the voter checks -- if only the voter had it, the two could not
# agree. Already in the graph via `aster_transport_core`, so this adds no new
# resolution.
blake3 = { version = "1", optional = true }
# Coordination voter (the `coordination` feature). Both are exact pins because
# this subsystem's on-disk and on-wire formats are versioned against them.
#
# openraft: no `serde`. The blanket AppData/AppDataResponse impls include
# OptionalSerde, which is a no-op only while that feature is off -- enabling it
# anywhere in the graph silently adds Serialize/Deserialize bounds to
# CommandV1/CommandReplyV1. Treat it as part of the contract, not a dependency knob.
openraft = { version = "=0.9.25", default-features = false, features = [
    "storage-v2",
    "generic-snapshot-data",
], optional = true }
# redb 4.1.0 is deliberately the version iroh-blobs already resolves to, so a
# voter that also stores blobs links one copy. (iroh-docs pulls 3.1.3; the two
# coexist because redb declares no `links` key -- which is exactly why this
# subsystem uses redb rather than rusqlite, where `links = "sqlite3"` makes two
# versions a hard build failure.)
redb = { version = "=4.1.0", optional = true }
# §7.1 signed genesis/join verification. Exact pin, and the same version the
# transport core already uses, so one Ed25519 implementation verifies every
# Aster signature rather than two that could disagree.
ed25519-dalek = { version = "=3.0.0-rc.0", optional = true }
# JSON for root public-key files and, with `rpc`, registry manifests.
serde_json = "1"
toml = "0.8"
# The exact native stack is deliberately re-exported under `aster::native` for
# advanced Rust consumers. The facade types remain the compatibility boundary.
iroh = { workspace = true }
iroh-blobs = { workspace = true, optional = true }
iroh-docs = { workspace = true }
iroh-gossip = { workspace = true, optional = true }
iroh-tickets = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
# Structured logging (R10). The facade only: no subscriber is installed here --
# the application picks one (see docs/aster-rust-getstarted.md "Logging"). Same
# version core and iroh already use, so this adds no crate to the graph.
tracing = "0.1"
thiserror = "2"
hex = "0.4"
base64 = "0.22"
# OS CSPRNG for SecretKey::generate (32-byte Ed25519 seed) — same source the
# C FFI and Python binding use. Pinned to core's getrandom major.
getrandom = "0.2"
sha2 = { version = "0.10", optional = true }
url = { version = "2.5", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
reqwest = { version = "=0.13.3", default-features = false, features = ["blocking", "rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-platform-verifier = { version = "=0.7.0", optional = true }
httpdate = { version = "1", optional = true }

# §11.4 atomic snapshot replacement on Windows. `rename` over an existing file
# is not the same operation there that it is on Unix, so the replacement step
# goes through `ReplaceFileW`.
#
# Enabled by `coordination-client` (and therefore by `coordination`): the
# client journal's atomic-replace needs `MoveFileExW(..., WRITE_THROUGH)` on
# Windows for exactly the reason the snapshot replacement does — a rename
# that is atomic but not write-through leaves the S4-D durability claim
# false on one platform. `scripts/check-coordination-deps.sh` proves the edge
# is present in both graphs and absent from `default`. The directory lock
# does *not* need it: `std::fs::File::try_lock()` is stable on the pinned
# toolchain, so v1 adds no `fs2`/`fs4` edge for an operation the standard
# library provides.
# The §11.5 free-space tier reads `statvfs` on Unix hosts.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
], optional = true }

# The quickstart example uses blobs + docs; skip it when those features are off
# (e.g. the `--no-default-features --features rpc` build matrix).
[[example]]
name = "quickstart"
required-features = ["blobs", "docs"]

# The shell example needs the RPC stack and a real PTY (portable-pty, dev-dep).
[[example]]
name = "shell"
required-features = ["rpc"]

# Restart/reconnect investigation probe (docs/_internal/investigations/
# 2026-10-15-restart-reconnect.md): an enrolled AsterServer that measures
# Docs, blob and gossip recovery against one peer across restarts.
[[example]]
name = "restart_probe"
required-features = ["enrollment", "rpc", "docs", "gossip"]

# Cross-binding RPC interop smoke (Rust side). Source lives with the rest of
# the matrix in tests/interop/; driven by tests/interop/run.py.
[[example]]
name = "interop_echo"
path = "../tests/interop/rust/interop_echo.rs"
required-features = ["rpc", "expose", "otel"]

# Dispatch benchmark load driver (design §6 Step 0). Shares the InteropEcho
# contract with tests/interop/; driven by benchmarks/dispatch/run.py.
[[example]]
name = "dispatch_driver"
path = "../benchmarks/dispatch/driver.rs"
required-features = ["rpc", "binding-support"]

# The §S3-F process-loss voter. Built only when the test harness feature is on,
# so an ordinary `cargo build` neither compiles nor ships it. The integration
# test finds it through `CARGO_BIN_EXE_coordination-voter`.
[[bin]]
name = "coordination-voter"
path = "src/bin/coordination_voter.rs"
required-features = ["coordination-testing"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
# Topology integration tests forge raw `topo/v1/…` records to prove readers
# drop them (attribution rules) — the record encoders live in core.
aster_transport_core = { path = "../core", version = "=0.3.0", registry = "aster" }
# Real PTY for the `shell` example (allocate a tty, spawn $SHELL, resize ioctl).
portable-pty = "0.9"
# Local terminal raw mode + size for the interactive `shell` client.
crossterm = "0.27"
# For implementing the RPC ServiceDispatch trait in tests (mirrors the macro).
async-trait = "0.1"
# Coordination integration tests mint real signed genesis documents, because a
# voter refuses an unsigned one and a fixture that could not pass verification
# would make every bootstrap test pass for the wrong reason. Same exact pin as
# the optional dependency above, so this adds nothing to the graph.
ed25519-dalek = { version = "=3.0.0-rc.0" }
# `umask(2)`, for the storage scratch helper in `tests/common/scratch.rs`. The
# integration targets are separate binaries and inherit none of the library's
# `cfg(test)` umask narrowing, so a host (or a `docker exec` step) with a
# permissive umask hands production a world-writable storage directory, which it
# refuses. Dev-only: `scripts/check-coordination-deps.sh` resolves with
# `-e normal`, so this adds no edge to any shipped feature graph.
libc = { workspace = true }
# Coordination ticket tests forge a non-canonical ticket -- a reserved header bit
# set -- to prove apply refuses bytes no encoder produces. The same version core
# encodes tickets with, so the test and the production encoder agree.
bs58 = "0.5"
# For deriving ForyStruct on payload types in rpc tests (the `#[derive(ForyStruct)]`
# macro emits `::fory_core::` paths, so both are needed in the test crate).
fory-core = "=1.7.6"
fory-derive = "=1.7.6"
# Build streaming request/response bodies in the `expose` integration tests.
http-body-util = "0.1"
# The `otel` tests export to aster-otel's in-memory exporters.
aster-otel = { path = "../aster-otel", version = "=0.3.0", registry = "aster", features = ["testing"] }
# Log subscriber for the `restart_probe` example. Same exact pin aster-otel
# resolves, so nothing new enters the graph.
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "registry", "fmt", "env-filter", "ansi"] }
