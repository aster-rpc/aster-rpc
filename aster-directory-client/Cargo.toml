[package]
name = "aster-directory-client"
version = "0.3.0"
edition = "2024"
rust-version.workspace = true
description = "Client for the @aster directory service: handles, service publication and access grants."
license = "MIT OR Apache-2.0"
repository = "https://forge.emrul.dev/Aster/aster-rpc-internal"
publish = ["aster"]

# Every dependency is already in the Aster facade's tree; versions follow the
# facade's pins (Fory exactly, for the cross-language wire format).
[dependencies]
anyhow = { workspace = true }
aster = { path = "../aster", default-features = false, features = ["rpc"] }
aster-config = { path = "../aster-config" }
blake3 = "1"
ed25519-dalek = "=3.0.0-rc.0"
fory-core = "=1.7.6"
fory-derive = "=1.7.6"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
