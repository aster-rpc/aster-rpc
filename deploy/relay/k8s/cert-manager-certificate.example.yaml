# Optional: issue the relay certificate from a cert-manager issuer. Not part
# of kustomization.yaml; apply it yourself or add it to `resources`.
#
# Aster nodes verify relay TLS against the built-in WebPKI roots. If this
# issuer is a private CA, give the nodes its CA certificate with
# `[network] relay_ca_certs` / ASTER_RELAY_CA_CERTS (docs/relay-self-hosted.md,
# "A relay certificate from a private CA").
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aster-relay
  namespace: aster-relay
spec:
  secretName: aster-relay-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - relay.example.com
  issuerRef:
    kind: ClusterIssuer
    name: example-issuer
