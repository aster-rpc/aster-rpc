[package]
name = "mission-control"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false
license = "MIT OR Apache-2.0"
description = "Mission Control example — typed Aster services served over Iroh and HTTP."

[dependencies]
aster = { path = "../../../aster", default-features = false, features = ["rpc"] }
aster-transport-salvo = { path = "../../../aster-transport-salvo" }
fory-core = "=1.7.6"
fory-derive = "=1.7.6"
tokio = { workspace = true }
salvo = { workspace = true }
# Required by the generated JSON projection (codecs = ["json"]): serde on the
# payload types, serde_json in the generated transcoder.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# In-process HTTP client for the typed round-trip test.
salvo = { workspace = true, features = ["test"] }
aster_transport_core = { path = "../../../core" }
