[package]
name = "aster_transport_core"
version = "0.2.0"
edition = "2021"

[dependencies]
iroh = { workspace = true }
iroh-blobs = { workspace = true }
iroh-docs = { workspace = true }
iroh-gossip = { workspace = true }
iroh-tickets = { workspace = true }
iroh-mdns-address-lookup = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
bytes = { workspace = true }
anyhow = { workspace = true }
futures-lite = { workspace = true }
tracing = "0.1"
url = "2.5"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
hex = "0.4"
bs58 = "0.5"
ed25519-dalek = { version = "=3.0.0-rc.0", features = ["rand_core"] }
crossbeam-utils = { workspace = true }
getrandom = "0.2"
fory-core = "1.1.0-rc.1"
fory-derive = "1.1.0-rc.1"
thiserror = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
rand_core = { version = "0.9", features = ["os_rng"] }

[features]
# Ownership-attestation chain. Apache Fory is now a core dependency because
# simple trust-config primitives also use Fory XLANG.
attestation = ["dep:thiserror", "dep:base64"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "ring_bench"
harness = false
