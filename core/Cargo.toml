[package]
name = "aster_transport_core"
version = "0.3.0"
edition = "2021"
rust-version.workspace = true
description = "Shared Rust transport engine for the Aster SDK."
license = "MIT OR Apache-2.0"
repository = "https://forge.emrul.dev/Aster/aster-rpc-internal"
publish = ["aster"]

[dependencies]
iroh = { workspace = true }
iroh-blobs = { workspace = true }
iroh-docs = { workspace = true }
iroh-gossip = { workspace = true }
iroh-tickets = { workspace = true }
iroh-mdns-address-lookup = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
async-trait = "0.1"
bytes = { workspace = true }
anyhow = { workspace = true }
futures-lite = { workspace = true }
tracing = "0.1"
url = "2.5"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
hex = "0.4"
zstd = { version = "0.14", default-features = false }
bs58 = "0.5"
ed25519-dalek = { version = "=3.0.0-rc.0", features = ["rand_core"] }
crossbeam-utils = { workspace = true }
getrandom = "0.2"
fory-core = "=1.7.6"
fory-derive = "=1.7.6"
thiserror = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
rand_core = { version = "0.9", features = ["os_rng"] }

[features]
# Test-only ingress counters (see reactor::ingress_metrics). Never on in a
# shipping build; the tests that need them enable them explicitly.
ingress-metrics = []
# Test-only fault injection (see reactor::test_hooks). Never on in a shipping
# build; the tests that need it enable it explicitly.
test-hooks = []
# Ownership-attestation chain. Apache Fory is now a core dependency because
# simple trust-config primitives also use Fory XLANG.
attestation = ["dep:thiserror", "dep:base64"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "ring_bench"
harness = false
