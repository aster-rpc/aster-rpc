[package]
name = "aster_transport_core"
version = "0.2.0"
edition = "2021"

[dependencies]
iroh = { workspace = true }
iroh-blobs = { workspace = true }
iroh-docs = { workspace = true }
iroh-gossip = { workspace = true }
iroh-tickets = { workspace = true }
iroh-mdns-address-lookup = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
bytes = { workspace = true }
anyhow = { workspace = true }
futures-lite = { workspace = true }
tracing = "0.1"
url = "2.5"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
hex = "0.4"
bs58 = "0.5"
ed25519-dalek = { version = "=3.0.0-pre.7", features = ["rand_core"] }
crossbeam-utils = { workspace = true }
getrandom = "0.2"
fory-core = { version = "1.1.0-rc.1", optional = true }
fory-derive = { version = "1.1.0-rc.1", optional = true }
thiserror = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }

[features]
# Ownership-attestation chain (pulls in Apache Fory for the wire format).
# Off by default so the pyo3 / ffi consumers don't compile Fory unless wanted.
attestation = ["dep:fory-core", "dep:fory-derive", "dep:thiserror", "dep:base64"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "ring_bench"
harness = false
