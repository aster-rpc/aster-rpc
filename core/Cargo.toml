[package]
name = "aster_transport_core"
version = "0.3.0"
edition = "2021"
rust-version.workspace = true
description = "Shared Rust transport engine for the Aster SDK."
license = "MIT OR Apache-2.0"
repository = "https://forge.emrul.dev/Aster/aster-rpc-internal"
publish = ["aster"]

[dependencies]
iroh = { workspace = true }
iroh-blobs = { workspace = true, features = ["zstd"] }
iroh-docs = { workspace = true }
iroh-gossip = { workspace = true }
iroh-tickets = { workspace = true }
iroh-mdns-address-lookup = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
async-trait = "0.1"
bytes = { workspace = true }
anyhow = { workspace = true }
futures-lite = { workspace = true }
tracing = "0.1"
url = "2.5"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
unicode-normalization = "0.1"
hex = "0.4"
zstd = { version = "0.14", default-features = false }
bs58 = "0.5"
ed25519-dalek = { version = "=3.0.0-rc.0", features = ["rand_core"] }
crossbeam-utils = { workspace = true }
getrandom = "0.2"
fory-core = "=1.7.6"
fory-derive = "=1.7.6"
base64 = "0.22"
# Compact Ed25519 JWS signing and verification for delegation chains and
# enrollment credentials (AWS-LC, the backend the native stack already uses).
aws-lc-rs = { version = "1.18", optional = true }
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
rand_core = { version = "0.9", features = ["os_rng"] }
# Probes whether a persistent node's last bound UDP port is free (bind_ports).
socket2 = "0.6"
# Relay CA bundles (network_config): PEM parsing and a trust-anchor check at
# start. Both already in the graph through iroh; no crypto provider enabled here.
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-pki-types = { version = "1.12", features = ["std"] }

[features]
# Delegation chains: bundled compact JWS links verified offline in one call.
# See docs/_internal/ownership-attestations.md.
delegation = ["dep:aws-lc-rs"]
# JWT enrollment and consumer policy, built on delegation's JWS.
enrollment = ["delegation"]
# Test-only ingress counters (see reactor::ingress_metrics). Never on in a
# shipping build; the tests that need them enable them explicitly.
ingress-metrics = []
# Test-only fault injection (see reactor::test_hooks). Never on in a shipping
# build; the tests that need it enable it explicitly.
test-hooks = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
# relay_private_ca test: an in-process iroh relay with a certificate from a
# throwaway private CA, and the client-side TLS check against it.
iroh-relay = { workspace = true, features = ["server"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[[bench]]
name = "ring_bench"
harness = false

[target.'cfg(target_os = "linux")'.dependencies]
# Read-only adjtimex query for enrollment clock synchronization status.
libc = { workspace = true }
