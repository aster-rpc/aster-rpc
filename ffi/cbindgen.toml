# cbindgen configuration for aster_transport_ffi.
#
# Regenerate:   ffi/scripts/gen-header.sh
# Drift check:  ffi/scripts/check-header.sh   (CI; exits non-zero on drift)

language = "C"
header = "/* Generated by cbindgen from ffi/src -- regenerate with ffi/scripts/gen-header.sh */"
autogen_warning = "/* DO NOT EDIT */"
include_guard = "ASTER_FFI_H"
cpp_compat = true

no_includes = false
include_version = true

[export]
# cbindgen only emits types reachable from exported functions/structs. Enums
# whose values travel as plain uint32_t (struct fields, `mode`/`kind`
# arguments) are not reachable, so list every ABI enum explicitly to keep the
# header self-describing. (`include` takes exact item names, not globs.)
include = [
  "aster_status_t",
  "aster_event_kind_t",
  "aster_relay_mode_t",
  "aster_hook_failure_mode_t",
  "aster_hook_decision_t",
  "aster_connection_type_t",
  "aster_path_kind_t",
  "aster_doc_query_mode_t",
  "aster_download_policy_mode_t",
  "aster_doc_share_mode_t",
  "aster_registry_key_kind_t",
  "aster_trust_mode_t",
  "aster_portmapper_t",
  "aster_blob_format_t",
  "aster_fetch_strategy_t",
  "aster_blob_status_t",
  "aster_local_access_t",
  "aster_retire_outcome_t",
  "aster_id_kind_t",
  "aster_attestation_role_t",
  "aster_grant_state_t",
  "aster_grant_outcome_kind_t",
  "aster_dispatch_event_kind_t",
  "aster_cancel_reason_t",
  "aster_method_pattern_t",
  "aster_server_option_t",
]
