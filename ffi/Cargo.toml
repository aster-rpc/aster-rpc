[package]
name = "aster_transport_ffi"
version = "0.3.0"
edition = "2021"
rust-version.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "soak_test_runner"
path = "src/bin/soak_test_runner/main.rs"

[dependencies]
aster_transport_core = { path = "../core", version = "=0.3.0" }
# Plan D1: the C ABI wraps the `aster` crate (node + config + Gate 0 since ABI
# 3.2). Binding profile: default + rpc + metrics + binding-support.
aster = { path = "../aster", version = "=0.3.0", features = ["rpc", "metrics", "binding-support"] }
iroh = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
getrandom = "0.2"
once_cell = { workspace = true }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
# Note: aster_ffi.h is regenerated externally with cbindgen; not a build dep.

[dev-dependencies]
loom = "0.7"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "ffi_benchmarks"
harness = false
