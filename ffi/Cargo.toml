[package]
name = "aster_transport_ffi"
version = "0.3.0"
edition = "2021"
rust-version.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "soak_test_runner"
path = "src/bin/soak_test_runner/main.rs"

[dependencies]
aster_transport_core = { path = "../core", version = "=0.3.0" }
# Observability (ABI 4.6, design OBSERVABILITY_HEALTH_DESIGN.md §2.1/§7): the
# binding profile's exporters -- OTLP over http/protobuf, OTLP logs (path B,
# `aster_log_emit`) and the Prometheus pull reader (`aster_metrics_prometheus`).
aster-otel = { path = "../aster-otel", version = "=0.3.0", features = ["otlp", "otlp-logs", "prometheus"] }
# Plan D1: the C ABI wraps the `aster` crate (node + config + Gate 0 since ABI
# 3.2). Binding profile: default + rpc + metrics + binding-support, plus
# `expose` since ABI 4.2, `coordination-client` since ABI 4.4 (the binding
# profile's "once the binding surfaces it"; the client only, never the voter),
# and `otel` + `health` since ABI 4.6 (built-in metrics and spans, the ops
# listener behind `aster_health_*`).
aster = { path = "../aster", version = "=0.3.0", features = ["rpc", "metrics", "binding-support", "expose", "coordination-client", "otel", "health"] }
async-trait = "0.1"
iroh = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
getrandom = "0.2"
once_cell = { workspace = true }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
# Note: aster_ffi.h is regenerated externally with cbindgen; not a build dep.

[dev-dependencies]
# In-memory exporters for tests/observability.rs.
aster-otel = { path = "../aster-otel", version = "=0.3.0", features = ["testing"] }
# Rust events for the log bridge cases.
tracing = "0.1"
loom = "0.7"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
# getrusage: per-call CPU time in the ffi_unary_bench example.
libc = { workspace = true }

[features]
# Test-only: `tests/coordination.rs` hosts a real voter group in process
# (`aster/coordination-testing`; D7: the voter is Rust-only). A feature, not a
# dev-dependency, so a workspace `--all-targets` build does not unify the voter
# into every crate's test graph (same as the NAPI `coordination-fixture`).
#   cargo test -p aster_transport_ffi --features coordination-fixture --test coordination
coordination-fixture = ["aster/coordination-testing"]

[[test]]
name = "coordination"
required-features = ["coordination-fixture"]

[[bench]]
name = "ffi_benchmarks"
harness = false

# C ABI unary benchmark (fast path vs cancellable vs dedicated stream); see
# the file header. `cargo run --release -p aster_transport_ffi --example ffi_unary_bench`.
[[example]]
name = "ffi_unary_bench"
path = "../benchmarks/dispatch/ffi_unary_bench.rs"
