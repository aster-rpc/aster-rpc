[workspace]
members = ["core", "ffi", "aster", "aster-expose", "aster-macros", "aster-transport-salvo", "examples/rust/mission-control", "bindings/python/rust", "bindings/typescript/native"]
exclude = ["core/fuzz", "ffi/fuzz"]
resolver = "2"

[workspace.dependencies]
# Core Iroh
# Declared as crates.io versions; [patch.crates-io] below rewrites them
# to the aster-rpc forks (read_into, poll_driver — see UPGRADE_1.0.0-rc.0.md).
iroh        = "=1.0.1"
iroh-blobs  = "0.103.0"
iroh-docs   = "0.101.0"
iroh-gossip = "0.101.0"
iroh-tickets = "=1.0.0"
# mDNS lookup moved to a separate crate in iroh 1.0.0-rc.0.
iroh-mdns-address-lookup = "0.4"

# Python FFI
pyo3        = { version = "0.28.2", features = ["extension-module", "abi3-py39", "generate-import-lib"] }
pyo3-async-runtimes = { version = "0.28.0", features = ["tokio-runtime"] }

# Common dependencies
tokio       = { version = "1", features = ["full"] }
bytes       = "1"
anyhow      = "1"
futures-lite = "2"
once_cell = "1"
libc = "0.2"
crossbeam-utils = "0.8"


# ──────────────────────────────────────────────────────────────────────────
# aster-rpc forks
# ──────────────────────────────────────────────────────────────────────────
# All iroh/noq crates are rewired to the aster-rpc forks via [patch.crates-io].
# Pinned to commit SHAs for reproducible builds. Bump these when pulling in
# new fork changes.
#
# Why [patch.crates-io]: transitive consumers (e.g. iroh-blobs depends on
# iroh from crates.io) must also resolve to the fork. A regular dep override
# only affects the top-level use; [patch] rewires every resolution.
[patch.crates-io]
iroh        = { git = "https://github.com/aster-rpc/iroh",        rev = "5228d64d91b10ef5f5bc9fcf8855b7774102cfc9" }
iroh-base   = { git = "https://github.com/aster-rpc/iroh",        rev = "5228d64d91b10ef5f5bc9fcf8855b7774102cfc9" }
iroh-relay  = { git = "https://github.com/aster-rpc/iroh",        rev = "5228d64d91b10ef5f5bc9fcf8855b7774102cfc9" }
iroh-blobs  = { git = "https://github.com/aster-rpc/iroh-blobs",  rev = "a2e15663c4015dc37118845d160100ebdbdb4aeb" }
iroh-docs   = { git = "https://github.com/aster-rpc/iroh-docs",   rev = "2f3f3df834dfe6ce83f052c9c94ef80db2f5627c" }
iroh-gossip = { git = "https://github.com/aster-rpc/iroh-gossip", rev = "76492e4cf8a745cae27ea57fb8a30d42ab675498" }
noq         = { git = "https://github.com/aster-rpc/noq",         rev = "c84091f4c1d62f3c9025e40014fc2db59f239ffc" }
noq-udp     = { git = "https://github.com/aster-rpc/noq",         rev = "c84091f4c1d62f3c9025e40014fc2db59f239ffc" }
noq-proto   = { git = "https://github.com/aster-rpc/noq",         rev = "c84091f4c1d62f3c9025e40014fc2db59f239ffc" }

# ──────────────────────────────────────────────────────────────────────────
# Aster Salvo fork (HTTP transport — see docs/_internal/working_ideas/aster-http3-transport.md)
# ──────────────────────────────────────────────────────────────────────────
# Pinned to the SAME rev portal-agent uses so the product family builds one
# identical Salvo — bump portal + any other consumer to match. 0e8477c1 = tag
# `aster-salvo-2026-07-05`: aster-salvo-2026-06-27 base plus two new patches —
# `wt-ratified-webkit-interop` (WebTransport SETTINGS/accept interop with
# Safari/Network.framework ratified-era clients) and `http-alt-svc-toggle`
# (`HttpBuilder::auto_alt_svc_header(false)` so page/API traffic stays on TCP).
# Active patches: default keepalive, WT stream control,
# `Request::web_transport_owned()`, `QuinnListener::transport_config_tuner()`,
# WT ratified interop, alt-svc toggle. In this absorption the raw-quinn
# patch GRADUATED upstream (PR #1528 — `Request::quinn_connection()`), so it was
# dropped, not re-applied; no Aster consumer used it. The fork keeps each
# remaining Aster patch on its own branch and re-cherry-picks onto main after
# each upstream merge — pin the rev/tag, not the branch. Maintenance workflow:
# ~/dev/aster/salvo_fork.md.
# Propagation gotcha: the fork patches h3 / h3-quinn / salvo-http3 internally,
# but [patch.crates-io] does NOT cross workspaces — re-declare them here.
# Follow-up: cut a versioned tag (v0.93.0-aster.1) and move all consumers off
# the raw rev.
salvo        = { git = "https://github.com/aster-rpc/salvo", rev = "0e8477c10760b7f66fa5667e2755c938d07393c0" }
salvo_core   = { git = "https://github.com/aster-rpc/salvo", rev = "0e8477c10760b7f66fa5667e2755c938d07393c0" }
salvo_macros = { git = "https://github.com/aster-rpc/salvo", rev = "0e8477c10760b7f66fa5667e2755c938d07393c0" }
# (salvo_extra is patched by portal-agent but not yet pulled here — re-add the
#  line when a feature brings it into the graph, else cargo warns "patch unused".)
salvo-http3  = { git = "https://github.com/aster-rpc/salvo", rev = "0e8477c10760b7f66fa5667e2755c938d07393c0" }
h3           = { git = "https://github.com/aster-rpc/salvo", rev = "0e8477c10760b7f66fa5667e2755c938d07393c0" }
h3-quinn     = { git = "https://github.com/aster-rpc/salvo", rev = "0e8477c10760b7f66fa5667e2755c938d07393c0" }
