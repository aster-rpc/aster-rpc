[workspace]
members = ["core", "ffi", "bindings/python/rust", "bindings/typescript/native"]
exclude = ["core/fuzz", "ffi/fuzz"]
resolver = "2"

[workspace.dependencies]
# Core Iroh
# Declared as crates.io versions; [patch.crates-io] below rewrites them
# to the aster-rpc forks (read_into, poll_driver — see UPGRADE_0.98.md).
iroh        = "0.98.0"
iroh-blobs  = "0.100.0"
iroh-docs   = "0.98.0"
iroh-gossip = "0.98.0"
iroh-tickets = "0.5.0"

# Python FFI
pyo3        = { version = "0.28.2", features = ["extension-module", "abi3-py39"] }
pyo3-async-runtimes = { version = "0.28.0", features = ["tokio-runtime"] }

# Common dependencies
tokio       = { version = "1", features = ["full"] }
bytes       = "1"
anyhow      = "1"
futures-lite = "2"
once_cell = "1"
libc = "0.2"
crossbeam-utils = "0.8"


# ──────────────────────────────────────────────────────────────────────────
# aster-rpc forks
# ──────────────────────────────────────────────────────────────────────────
# All iroh/noq crates are rewired to the aster-rpc forks via [patch.crates-io].
# Pinned to commit SHAs for reproducible builds. Bump these when pulling in
# new fork changes.
#
# Why [patch.crates-io]: transitive consumers (e.g. iroh-blobs depends on
# iroh from crates.io) must also resolve to the fork. A regular dep override
# only affects the top-level use; [patch] rewires every resolution.
[patch.crates-io]
iroh        = { git = "https://github.com/aster-rpc/iroh",        rev = "ae33aa590c2eaf80dabdefdd58ff216ba5378e96" }
iroh-base   = { git = "https://github.com/aster-rpc/iroh",        rev = "ae33aa590c2eaf80dabdefdd58ff216ba5378e96" }
iroh-relay  = { git = "https://github.com/aster-rpc/iroh",        rev = "ae33aa590c2eaf80dabdefdd58ff216ba5378e96" }
iroh-blobs  = { git = "https://github.com/aster-rpc/iroh-blobs",  rev = "fc85abf0b286c2cdcf4bc6d18221e8d54add77e3" }
iroh-docs   = { git = "https://github.com/aster-rpc/iroh-docs",   rev = "970c4d18105cb67fc8be48379b537ff2ee1f375f" }
iroh-gossip = { git = "https://github.com/aster-rpc/iroh-gossip", rev = "aa46a548079c5b7714cb297741ca249cac840123" }
noq         = { git = "https://github.com/aster-rpc/noq",         rev = "567919965474964b012d70a0f34c793a8be58c09" }
noq-udp     = { git = "https://github.com/aster-rpc/noq",         rev = "567919965474964b012d70a0f34c793a8be58c09" }
noq-proto   = { git = "https://github.com/aster-rpc/noq",         rev = "567919965474964b012d70a0f34c793a8be58c09" }
