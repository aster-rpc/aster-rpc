[workspace]
members = ["core", "ffi", "aster", "aster-macros", "bindings/python/rust", "bindings/typescript/native"]
exclude = ["core/fuzz", "ffi/fuzz"]
resolver = "2"

[workspace.dependencies]
# Core Iroh
# Declared as crates.io versions; [patch.crates-io] below rewrites them
# to the aster-rpc forks (read_into, poll_driver — see UPGRADE_1.0.0-rc.0.md).
iroh        = "=1.0.0-rc.1"
iroh-blobs  = "0.102.0"
iroh-docs   = "0.100.0"
iroh-gossip = "0.100.0"
iroh-tickets = "=1.0.0-rc.1"
# mDNS lookup moved to a separate crate in iroh 1.0.0-rc.0.
iroh-mdns-address-lookup = "0.3"

# Python FFI
pyo3        = { version = "0.28.2", features = ["extension-module", "abi3-py39"] }
pyo3-async-runtimes = { version = "0.28.0", features = ["tokio-runtime"] }

# Common dependencies
tokio       = { version = "1", features = ["full"] }
bytes       = "1"
anyhow      = "1"
futures-lite = "2"
once_cell = "1"
libc = "0.2"
crossbeam-utils = "0.8"


# ──────────────────────────────────────────────────────────────────────────
# aster-rpc forks
# ──────────────────────────────────────────────────────────────────────────
# All iroh/noq crates are rewired to the aster-rpc forks via [patch.crates-io].
# Pinned to commit SHAs for reproducible builds. Bump these when pulling in
# new fork changes.
#
# Why [patch.crates-io]: transitive consumers (e.g. iroh-blobs depends on
# iroh from crates.io) must also resolve to the fork. A regular dep override
# only affects the top-level use; [patch] rewires every resolution.
[patch.crates-io]
iroh        = { git = "https://github.com/aster-rpc/iroh",        rev = "2f9f374298bd44b063e1eb2df02781124305a790" }
iroh-base   = { git = "https://github.com/aster-rpc/iroh",        rev = "2f9f374298bd44b063e1eb2df02781124305a790" }
iroh-relay  = { git = "https://github.com/aster-rpc/iroh",        rev = "2f9f374298bd44b063e1eb2df02781124305a790" }
iroh-blobs  = { git = "https://github.com/aster-rpc/iroh-blobs",  rev = "8707ffa4406577c2a58b46cec2bbffa5eae10c7a" }
iroh-docs   = { git = "https://github.com/aster-rpc/iroh-docs",   rev = "14107686520394f1df0ffe08cb45c9ec7a229221" }
iroh-gossip = { git = "https://github.com/aster-rpc/iroh-gossip", rev = "fdecec8a622b726b44e781e1252bf2452eb0f846" }
noq         = { git = "https://github.com/aster-rpc/noq",         rev = "e968659c47057b18210a4a03dc2366c65fe8f654" }
noq-udp     = { git = "https://github.com/aster-rpc/noq",         rev = "e968659c47057b18210a4a03dc2366c65fe8f654" }
noq-proto   = { git = "https://github.com/aster-rpc/noq",         rev = "e968659c47057b18210a4a03dc2366c65fe8f654" }
