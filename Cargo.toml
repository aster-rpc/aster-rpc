[workspace]
members = ["core", "ffi", "aster", "bindings/python/rust", "bindings/typescript/native"]
exclude = ["core/fuzz", "ffi/fuzz"]
resolver = "2"

[workspace.dependencies]
# Core Iroh
# Declared as crates.io versions; [patch.crates-io] below rewrites them
# to the aster-rpc forks (read_into, poll_driver — see UPGRADE_1.0.0-rc.0.md).
iroh        = "=1.0.0-rc.0"
iroh-blobs  = "0.101.0"
iroh-docs   = "0.99.0"
iroh-gossip = "0.99.0"
iroh-tickets = "=1.0.0-rc.0"
# mDNS lookup moved to a separate crate in iroh 1.0.0-rc.0.
iroh-mdns-address-lookup = "0.2"

# Python FFI
pyo3        = { version = "0.28.2", features = ["extension-module", "abi3-py39"] }
pyo3-async-runtimes = { version = "0.28.0", features = ["tokio-runtime"] }

# Common dependencies
tokio       = { version = "1", features = ["full"] }
bytes       = "1"
anyhow      = "1"
futures-lite = "2"
once_cell = "1"
libc = "0.2"
crossbeam-utils = "0.8"


# ──────────────────────────────────────────────────────────────────────────
# aster-rpc forks
# ──────────────────────────────────────────────────────────────────────────
# All iroh/noq crates are rewired to the aster-rpc forks via [patch.crates-io].
# Pinned to commit SHAs for reproducible builds. Bump these when pulling in
# new fork changes.
#
# Why [patch.crates-io]: transitive consumers (e.g. iroh-blobs depends on
# iroh from crates.io) must also resolve to the fork. A regular dep override
# only affects the top-level use; [patch] rewires every resolution.
[patch.crates-io]
iroh        = { git = "https://github.com/aster-rpc/iroh",        rev = "77a68a5477c15db261c66e7740a77ef752d9685f" }
iroh-base   = { git = "https://github.com/aster-rpc/iroh",        rev = "77a68a5477c15db261c66e7740a77ef752d9685f" }
iroh-relay  = { git = "https://github.com/aster-rpc/iroh",        rev = "77a68a5477c15db261c66e7740a77ef752d9685f" }
iroh-blobs  = { git = "https://github.com/aster-rpc/iroh-blobs",  rev = "ede454c774b24e1e4674aa713a37573b4144517d" }
iroh-docs   = { git = "https://github.com/aster-rpc/iroh-docs",   rev = "be04181e05e566adb033af786e09c4d20ac9390f" }
iroh-gossip = { git = "https://github.com/aster-rpc/iroh-gossip", rev = "d7d13582ba81d1b266cce758daccacad3ab5357c" }
noq         = { git = "https://github.com/aster-rpc/noq",         rev = "617899fe7e983f794e0162d15d8558258fa8c375" }
noq-udp     = { git = "https://github.com/aster-rpc/noq",         rev = "617899fe7e983f794e0162d15d8558258fa8c375" }
noq-proto   = { git = "https://github.com/aster-rpc/noq",         rev = "617899fe7e983f794e0162d15d8558258fa8c375" }
