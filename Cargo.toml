[workspace]
members = ["core", "ffi", "aster", "aster-macros", "bindings/python/rust", "bindings/typescript/native"]
exclude = ["core/fuzz", "ffi/fuzz"]
resolver = "2"

[workspace.dependencies]
# Core Iroh
# Declared as crates.io versions; [patch.crates-io] below rewrites them
# to the aster-rpc forks (read_into, poll_driver — see UPGRADE_1.0.0-rc.0.md).
iroh        = "=1.0.0"
iroh-blobs  = "0.103.0"
iroh-docs   = "0.101.0"
iroh-gossip = "0.101.0"
iroh-tickets = "=1.0.0"
# mDNS lookup moved to a separate crate in iroh 1.0.0-rc.0.
iroh-mdns-address-lookup = "0.4"

# Python FFI
pyo3        = { version = "0.28.2", features = ["extension-module", "abi3-py39"] }
pyo3-async-runtimes = { version = "0.28.0", features = ["tokio-runtime"] }

# Common dependencies
tokio       = { version = "1", features = ["full"] }
bytes       = "1"
anyhow      = "1"
futures-lite = "2"
once_cell = "1"
libc = "0.2"
crossbeam-utils = "0.8"


# ──────────────────────────────────────────────────────────────────────────
# aster-rpc forks
# ──────────────────────────────────────────────────────────────────────────
# All iroh/noq crates are rewired to the aster-rpc forks via [patch.crates-io].
# Pinned to commit SHAs for reproducible builds. Bump these when pulling in
# new fork changes.
#
# Why [patch.crates-io]: transitive consumers (e.g. iroh-blobs depends on
# iroh from crates.io) must also resolve to the fork. A regular dep override
# only affects the top-level use; [patch] rewires every resolution.
[patch.crates-io]
iroh        = { git = "https://github.com/aster-rpc/iroh",        rev = "3c329f0c350b98a772bccdf697bfcc519fcdf25a" }
iroh-base   = { git = "https://github.com/aster-rpc/iroh",        rev = "3c329f0c350b98a772bccdf697bfcc519fcdf25a" }
iroh-relay  = { git = "https://github.com/aster-rpc/iroh",        rev = "3c329f0c350b98a772bccdf697bfcc519fcdf25a" }
iroh-blobs  = { git = "https://github.com/aster-rpc/iroh-blobs",  rev = "60d098c99d6a759b5b1bf0df635b149b50c74775" }
iroh-docs   = { git = "https://github.com/aster-rpc/iroh-docs",   rev = "2f3f3df834dfe6ce83f052c9c94ef80db2f5627c" }
iroh-gossip = { git = "https://github.com/aster-rpc/iroh-gossip", rev = "76492e4cf8a745cae27ea57fb8a30d42ab675498" }
noq         = { git = "https://github.com/aster-rpc/noq",         rev = "ddb8829dbc1cd401f8643ba9b93c542ffee43577" }
noq-udp     = { git = "https://github.com/aster-rpc/noq",         rev = "ddb8829dbc1cd401f8643ba9b93c542ffee43577" }
noq-proto   = { git = "https://github.com/aster-rpc/noq",         rev = "ddb8829dbc1cd401f8643ba9b93c542ffee43577" }
