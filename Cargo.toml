[workspace]
members = ["core", "ffi", "aster", "aster-cli-kit", "aster-config", "aster-directory-client", "aster-keystore", "aster-exec", "aster-exec-client", "aster-expose", "aster-macros", "aster-otel", "aster-transport-salvo", "examples/rust/mission-control", "bindings/python/rust", "bindings/typescript/native"]
exclude = ["core/fuzz", "ffi/fuzz"]
resolver = "2"

[workspace.package]
# Minimum supported Rust version, inherited by every member.
#
# 1.96 is *known-good* rather than bisected: 1.94.1 cannot parse this manifest
# at all (`registry` and `git` on one dependency is rejected), and 1.96.0 is
# what CI, the runner images and `rust-toolchain.toml` all run. Whether 1.95
# would also do has not been established, and claiming it without testing would
# be the same kind of guess this pin exists to remove.
rust-version = "1.96"

[workspace.dependencies]
# Core Iroh
# Each forked direct dependency has two locations: the public Forgejo Git
# source used in this workspace, and a version used when packaging for Aster's
# Cargo registry. [patch.crates-io] below still unifies transitive references.
iroh        = { version = "=1.3.0", registry = "aster", git = "https://forge.emrul.dev/Aster/iroh.git", rev = "1974e95825313f09e0870ef5bef11c6bc9fd97d9" }
iroh-blobs  = { version = "0.103.5", registry = "aster", git = "https://forge.emrul.dev/Aster/iroh-blobs.git", rev = "b535aa30ae61f82a1b048015817bf4365862ce62" }
iroh-docs   = { version = "0.101.5", registry = "aster", git = "https://forge.emrul.dev/Aster/iroh-docs.git", rev = "ad88873ed57b1e7550ef8e091d0d7f0a947e3678" }
iroh-gossip = { version = "0.101.0", registry = "aster", git = "https://forge.emrul.dev/Aster/iroh-gossip.git", rev = "de100e9aa59386e39a32d6744bd902935c16fcf6" }
iroh-tickets = { version = "=1.0.0", registry = "aster", git = "https://github.com/n0-computer/iroh-tickets", rev = "4899684e1209dea29ed28aa2314450927557b037" }
# mDNS lookup moved to a separate crate in iroh 1.0.0-rc.0.
iroh-mdns-address-lookup = { version = "=0.4.0", registry = "aster", git = "https://github.com/n0-computer/iroh-address-lookups", rev = "87fdd7ea1a902845695f8f685c1905f096b3d02d" }

# HTTP/WebTransport transport. Like the Iroh entries above, the Git location
# is used for repository builds and the version is used for registry packages.
salvo = { version = "=1.0.4", registry = "aster", git = "https://forge.emrul.dev/Aster/salvo.git", rev = "35aa745dfca50c2e5a640c0d0c93153b033fa931" }

# Python FFI
pyo3        = { version = "0.29.3", features = ["extension-module", "abi3-py39", "generate-import-lib"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }

# Common dependencies
tokio       = { version = "1", features = ["full"] }
bytes       = "1"
anyhow      = "1"
futures-lite = "2"
once_cell = "1"
libc = "0.2"
crossbeam-utils = "0.8"


# ──────────────────────────────────────────────────────────────────────────
# aster-rpc forks
# ──────────────────────────────────────────────────────────────────────────
# All iroh/noq crates are rewired to the aster-rpc forks via [patch.crates-io].
# Pinned to commit SHAs for reproducible builds. Bump these when pulling in
# new fork changes.
#
# Why [patch.crates-io]: transitive consumers (e.g. iroh-blobs depends on
# iroh from crates.io) must also resolve to the fork. A regular dep override
# only affects the top-level use; [patch] rewires every resolution.
[patch.crates-io]
iroh        = { git = "https://forge.emrul.dev/Aster/iroh.git",        rev = "1974e95825313f09e0870ef5bef11c6bc9fd97d9" }
iroh-base   = { git = "https://forge.emrul.dev/Aster/iroh.git",        rev = "1974e95825313f09e0870ef5bef11c6bc9fd97d9" }
iroh-relay  = { git = "https://forge.emrul.dev/Aster/iroh.git",        rev = "1974e95825313f09e0870ef5bef11c6bc9fd97d9" }
iroh-blobs  = { git = "https://forge.emrul.dev/Aster/iroh-blobs.git",  rev = "b535aa30ae61f82a1b048015817bf4365862ce62" }
iroh-docs   = { git = "https://forge.emrul.dev/Aster/iroh-docs.git",   rev = "ad88873ed57b1e7550ef8e091d0d7f0a947e3678" }
iroh-gossip = { git = "https://forge.emrul.dev/Aster/iroh-gossip.git", rev = "de100e9aa59386e39a32d6744bd902935c16fcf6" }
noq         = { git = "https://forge.emrul.dev/Aster/noq.git",         rev = "867a3a9a33cc75436a52272ee49ba34a007a957b" }
noq-udp     = { git = "https://forge.emrul.dev/Aster/noq.git",         rev = "867a3a9a33cc75436a52272ee49ba34a007a957b" }
noq-proto   = { git = "https://forge.emrul.dev/Aster/noq.git",         rev = "867a3a9a33cc75436a52272ee49ba34a007a957b" }
# Registry bridges are code-identical to their crates.io releases. Pinning the
# upstream commits here makes the development graph match the source that is
# repackaged with Aster-registry dependency metadata for consumers.
irpc                     = { git = "https://github.com/n0-computer/irpc",                 rev = "0ed2b235d5c797b54d8263ecb3b0247272d055f9" }
netwatch                 = { git = "https://github.com/n0-computer/net-tools",            rev = "0030e57fc70981895bb86212ff0f059cc41c8a4e" }
portmapper               = { git = "https://github.com/n0-computer/net-tools",            rev = "0030e57fc70981895bb86212ff0f059cc41c8a4e" }
iroh-mdns-address-lookup = { git = "https://github.com/n0-computer/iroh-address-lookups", rev = "87fdd7ea1a902845695f8f685c1905f096b3d02d" }
iroh-tickets             = { git = "https://github.com/n0-computer/iroh-tickets",         rev = "4899684e1209dea29ed28aa2314450927557b037" }
iroh-util                = { git = "https://forge.emrul.dev/Aster/iroh-util.git",         rev = "afed9e6d07e41450fe1970e794782bab7df9c2f4" }

# ──────────────────────────────────────────────────────────────────────────
# Aster Salvo fork (HTTP transport — see docs/_internal/working_ideas/aster-http3-transport.md)
# ──────────────────────────────────────────────────────────────────────────
# Salvo 1.0.4: upstream v1.0.0 plus the Aster WebTransport patches.
# Published source tags: v1.0.0-aster.5 / aster-salvo-2026-10-11.
# PC13 adds cancellation-safe receive control while a read is pending.
# H3 versions: h3 0.0.9 / h3-quinn 0.0.12 /
# salvo-http3 0.7.2 / h3-datagram 0.0.3. Publish the fork wave before Aster.
# Maintenance workflow: ~/dev/aster/salvo_fork.md.
# Propagation gotcha: the fork patches h3 / h3-quinn / salvo-http3 / h3-datagram internally,
# but [patch.crates-io] does NOT cross workspaces — re-declare them here.
salvo        = { git = "https://forge.emrul.dev/Aster/salvo.git", rev = "35aa745dfca50c2e5a640c0d0c93153b033fa931" }
salvo_core   = { git = "https://forge.emrul.dev/Aster/salvo.git", rev = "35aa745dfca50c2e5a640c0d0c93153b033fa931" }
salvo_macros = { git = "https://forge.emrul.dev/Aster/salvo.git", rev = "35aa745dfca50c2e5a640c0d0c93153b033fa931" }
# (salvo_extra is patched by portal-agent but not yet pulled here — re-add the
#  line when a feature brings it into the graph, else cargo warns "patch unused".)
salvo-http3  = { git = "https://forge.emrul.dev/Aster/salvo.git", rev = "35aa745dfca50c2e5a640c0d0c93153b033fa931" }
h3           = { git = "https://forge.emrul.dev/Aster/salvo.git", rev = "35aa745dfca50c2e5a640c0d0c93153b033fa931" }
h3-quinn     = { git = "https://forge.emrul.dev/Aster/salvo.git", rev = "35aa745dfca50c2e5a640c0d0c93153b033fa931" }
h3-datagram  = { git = "https://forge.emrul.dev/Aster/salvo.git", rev = "35aa745dfca50c2e5a640c0d0c93153b033fa931" }
