[package]
name = "aster-transport-salvo"
version = "0.1.0"
edition = "2021"
description = "Aster RPC over HTTP (H1/H2/H3 + WebTransport) via the Aster Salvo fork."

[dependencies]
# Transport-agnostic dispatcher + codec/framing live in the aster crate (rpc).
aster = { path = "../aster", default-features = false, features = ["rpc"] }
aster_transport_core = { path = "../core" }

# Aster Salvo fork (pinned in the workspace-root [patch.crates-io]).
salvo = { version = "0.93", features = ["quinn", "rustls", "acme", "serve-static"] }
# TLS: self-signed cert generation + the WebTransport serverCertificateHashes hash.
rcgen = "0.13"
sha2 = "0.10"
# Ed25519 cert↔identity binding: the node key signs the cert's public key
# (generate) and a verifier checks it (verify_cert_binding). x509-parser reads
# the SPKI + SANs back out of the DER.
ed25519-dalek = "2"
x509-parser = "0.17"
hex = "0.4"
# Cert validity window (WebTransport serverCertificateHashes requires <= 14 days).
time = { version = "0.3", default-features = false, features = ["std"] }
# Direct quinn pin to unify with the transitive 0.11.x (h3-quinn -> salvo-http3)
# so the quinn::Connection the fork stashes in request.extensions() resolves by
# TypeId. Used for WT stats / stream control in a later increment.
quinn = { version = "0.11", default-features = false }

tokio = { workspace = true }
tokio-stream = "0.1"
futures-util = "0.3"
bytes = { workspace = true }

[dev-dependencies]
# `test` feature pulls salvo's in-process TestClient (unions with the normal
# salvo features above).
salvo = { version = "0.93", features = ["test"] }
# Typed payloads for the projection test (Fory + serde, both ends).
fory-core = "1.3"
fory-derive = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Real TLS client for the HTTPS handshake test (rustls, accept self-signed).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Install a process-level crypto provider in the test (multiple rustls stacks
# present — salvo + reqwest + wtransport — so it can't auto-select). Prod doesn't
# need this.
rustls = "0.23"
# Real WebTransport client for the H3/WT handshake test (same crate portal uses).
wtransport = { version = "0.6", features = ["quinn", "dangerous-configuration"] }
# Decode PEM to DER in cert tests (x509-parser is a normal dep above).
pem = "3"
